server:
  port: ${REALCRAFT_SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

realcraft:
  server-port: ${REALCRAFT_SERVER_PORT:8080}
  ai-api-url: ${REALCRAFT_AI_API_URL:}
  ai-api-key: ${REALCRAFT_AI_API_KEY:}
  ai-model: ${REALCRAFT_AI_MODEL:}
  data-dir: ${REALCRAFT_DATA_DIR:./data}
  max-image-mb: ${REALCRAFT_MAX_IMAGE_MB:10}